[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentaudit"
version = "0.1.0"
description = "Repository-aware AI reliability testing platform"
requires-python = ">=3.11"

dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
agentaudit = "agentaudit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
